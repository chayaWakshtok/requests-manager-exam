<form class="filters" [formGroup]="form" (ngSubmit)="$event.preventDefault()">
  <label class="field search">
    <span>חיפוש</span>
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
      </svg>
      <input type="search" [formControl]="search" placeholder="חיפוש בכותרת או בשם הארגון..." />
    </div>
  </label>

  <label class="field">
    <span>סטטוס</span>
    <select formControlName="status">
      <option value="">הכל</option>
      @for (s of statuses; track s) {
        <option [value]="s">{{ statusLabels[s] }}</option>
      }
    </select>
  </label>

  <label class="field">
    <span>עדיפות</span>
    <select formControlName="priority">
      <option value="">הכל</option>
      @for (p of priorities; track p) {
        <option [value]="p">{{ priorityLabels[p] }}</option>
      }
    </select>
  </label>

  <label class="field">
    <span>ארגון מתחיל ב...</span>
    <input formControlName="organizationName" placeholder="Acme" />
  </label>

  <label class="field">
    <span>מטפל</span>
    <input formControlName="assignedTo" placeholder="agent07" />
  </label>

  <label class="field">
    <span>מתאריך</span>
    <input type="date" formControlName="createdFrom" />
  </label>

  <label class="field">
    <span>עד תאריך</span>
    <input type="date" formControlName="createdTo" />
  </label>

  <button type="button" class="ghost clear" (click)="clear()">ניקוי סינון</button>
</form>
