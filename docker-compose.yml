# One command to run everything: docker compose up --build
# UI: http://localhost:8080   API/Swagger: http://localhost:5080/swagger
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Pass123"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: ./backend
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development   # enables Swagger UI
      ConnectionStrings__Default: "Server=sqlserver,1433;Database=RequestsManager;User Id=sa;Password=Your_strong_Pass123;TrustServerCertificate=True"
      Database__MigrateOnStartup: "true"
      Database__SeedIfEmptyCount: "100000"
    ports:
      - "5080:8080"

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:80"
